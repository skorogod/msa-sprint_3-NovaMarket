load_module modules/ngx_http_js_module.so;  # njs: нужен только для тестового /slow (задержка 5 с)

events {}

http {
    js_import slow from /etc/nginx/njs/slow.js;

    # лог на какой сервер ушёл запрос и что он ответил
    log_format main '"$request" $status upstream=$upstream_addr '
                    'upstream_status=$upstream_status upstream_time=$upstream_response_time';
    access_log /dev/stdout main;

    upstream logistics_backend {
        # При пяти ошибках сервер выключается на 30
        server 127.0.0.1:9090 max_fails=5 fail_timeout=30s;

        # Fallback
        server 127.0.0.1:9091 backup;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend/;

            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;

            # ошибки - обрыв, таймаут и ответы 5xx.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

            # Кто ответил, для тестов:
            #   127.0.0.1:9090                  — основной сервис (circuit закрыт)
            #   127.0.0.1:9090, 127.0.0.1:9091  — основной ошибся, ответил fallback
            #   127.0.0.1:9091                  — circuit открыт, основной даже не вызывали
            add_header X-Upstream $upstream_addr always;
        }
    }

    # Fallback-ответ.
    server {
        listen 127.0.0.1:9091;

        location / {
            default_type application/json;
            return 200 '{"status": "fallback", "service": "logistics", "message": "Logistics is temporarily unavailable, try later"}';
        }
    }

    # Тестовый сервер для имитации логистического сервиса
    server {
        listen 127.0.0.1:9090;

        location / {
            default_type application/json;
            return 200 '{"status": "success", "service": "logistics", "data": {"tracking_id": "TRK123456", "status": "in_transit"}}';
        }

        location /fast {
            default_type application/json;
            return 200 '{"status": "success", "endpoint": "fast", "message": "Quick response"}';
        }

        # Отвечает через 5 секунд — дольше таймаута в 3 секунды.
        # В исходном задании тут был обычный return без задержки, и таймаут не срабатывал.
        location /slow {
            js_content slow.handle;
        }

        location /error {
            default_type application/json;
            return 503 '{"status": "error", "endpoint": "error", "error": "service_unavailable"}';
        }
    }
}
